<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unstable Creators Live</title>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: rgba(30, 30, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --transition: 0.3s ease;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: #181818;
            border-right: 1px solid var(--glass-border);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .creator-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition);
        }

        .creator-card:hover, .creator-card.active {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            transform: scale(1.03);
        }

        .pfp {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #333;
            object-fit: cover;
        }

        .creator-info {
            display: flex;
            flex-direction: column;
        }

        .creator-name {
            font-weight: 600;
            font-size: 16px;
        }

        .sub-count {
            font-size: 12px;
            color: var(--text-sub);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            background: linear-gradient(135deg, #121212 0%, #1a2620 100%); 
        }

        .banner {
            height: 250px;
            background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0.2)), #333;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 40px;
        }

        .banner-content h1 {
            margin: 0;
            font-size: 48px;
        }

        .banner-content p {
            margin: 5px 0 0 0;
            font-size: 20px;
            color: var(--text-sub);
        }

        .videos-section {
            padding: 40px;
        }

        .videos-section h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .video-card {
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: var(--transition);
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .thumbnail {
            width: 100%;
            height: 160px;
            background: #2a2a2a;
            object-fit: cover;
        }

        .video-info {
            padding: 15px;
        }

        .video-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            font-size: 13px;
            color: var(--text-sub);
        }

        .loading-text {
            color: var(--text-sub);
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">UNSTABLE</div>
        
        <div class="creator-card active" onclick="loadCreator('@wemmbumc', this)" id="card-wemmbumc">
            <img class="pfp" src="" alt="Wemmbu" id="pfp-wemmbumc">
            <div class="creator-info">
                <span class="creator-name">Wemmbu</span>
                <span class="sub-count" id="subs-wemmbumc">Loading...</span>
            </div>
        </div>

        <div class="creator-card" onclick="loadCreator('@ParrotX2', this)" id="card-ParrotX2">
            <img class="pfp" src="" alt="Parrot" id="pfp-ParrotX2">
            <div class="creator-info">
                <span class="creator-name">Parrot</span>
                <span class="sub-count" id="subs-ParrotX2">Loading...</span>
            </div>
        </div>

        <div class="creator-card" onclick="loadCreator('@FlameFragsMC', this)" id="card-FlameFragsMC">
            <img class="pfp" src="" alt="Flame" id="pfp-FlameFragsMC">
            <div class="creator-info">
                <span class="creator-name">Flame</span>
                <span class="sub-count" id="subs-FlameFragsMC">Loading...</span>
            </div>
        </div>

        <div class="creator-card" onclick="loadCreator('@SpokeIsHere', this)" id="card-SpokeIsHere">
            <img class="pfp" src="" alt="Spoke" id="pfp-SpokeIsHere">
            <div class="creator-info">
                <span class="creator-name">Spoke</span>
                <span class="sub-count" id="subs-SpokeIsHere">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="banner" id="page-banner">
            <div class="banner-content">
                <h1 id="page-title">Loading...</h1>
                <p id="page-desc">Fetching channel data...</p>
            </div>
        </div>

        <div class="videos-section">
            <h2>Latest Videos</h2>
            <div class="video-grid" id="video-grid">
                <span class="loading-text">Fetching videos from YouTube...</span>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyDJOX9IPCUCs8M8Mkv_ZdYd-pwxi5Z4fpQ';
        
        function formatSubs(count) {
            if (count >= 1000000) {
                return (count / 1000000).toFixed(2) + 'M';
            } else if (count >= 1000) {
                return (count / 1000).toFixed(1) + 'K';
            }
            return count;
        }

        // Clean handle names for element IDs (removes the '@' symbol)
        function getIdKey(handle) {
            return handle.replace('@', '');
        }

        async function fetchChannelData(handle) {
            const url = `https://youtube.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails,brandingSettings&forHandle=${handle}&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.items && data.items.length > 0) {
                return data.items[0];
            }
            return null;
        }

        async function fetchVideos(playlistId) {
            const url = `https://youtube.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=8&playlistId=${playlistId}&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();
            return data.items || [];
        }

        async function loadCreator(handle, element) {
            if (element) {
                document.querySelectorAll('.creator-card').forEach(card => card.classList.remove('active'));
                element.classList.add('active');
            }

            const grid = document.getElementById('video-grid');
            grid.innerHTML = '<span class="loading-text">Loading videos...</span>';

            // 1. Instant load from cache if available so UI doesn't hang
            const cacheKey = `yt_cache_${handle}`;
            const cachedData = localStorage.getItem(cacheKey);
            if (cachedData) {
                const data = JSON.parse(cachedData);
                const keyId = getIdKey(handle);
                document.getElementById(`pfp-${keyId}`).src = data.pfp;
                document.getElementById(`subs-${keyId}`).innerText = `🔴 ${formatSubs(data.subs)} Subs`;
            }

            try {
                const channel = await fetchChannelData(handle);
                if (!channel) {
                    grid.innerHTML = '<span class="loading-text" style="color: #ff6b6b;">Channel not found.</span>';
                    return;
                }

                const snippet = channel.snippet;
                const stats = channel.statistics;
                const uploadsPlaylistId = channel.contentDetails.relatedPlaylists.uploads;
                
                const pfpUrl = snippet.thumbnails.default.url;
                const subCount = stats.subscriberCount;
                const keyId = getIdKey(handle);

                // Update Sidebar & Save to Cache
                document.getElementById(`pfp-${keyId}`).src = pfpUrl;
                document.getElementById(`subs-${keyId}`).innerText = `🔴 ${formatSubs(subCount)} Subs`;
                localStorage.setItem(cacheKey, JSON.stringify({ pfp: pfpUrl, subs: subCount }));

                // Update Main Page Header
                document.getElementById('page-title').innerText = snippet.title;
                document.getElementById('page-desc').innerText = `${formatSubs(subCount)} Subscribers • ${stats.videoCount} Videos`;
                
                if (channel.brandingSettings && channel.brandingSettings.image && channel.brandingSettings.image.bannerExternalUrl) {
                    document.getElementById('page-banner').style.backgroundImage = `linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0.2)), url('${channel.brandingSettings.image.bannerExternalUrl}')`;
                } else {
                    document.getElementById('page-banner').style.backgroundImage = `linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0.2)), #333`;
                }

                // Fetch and display the videos
                const videos = await fetchVideos(uploadsPlaylistId);
                grid.innerHTML = ''; 

                videos.forEach(video => {
                    const vidSnippet = video.snippet;
                    const videoId = vidSnippet.resourceId.videoId;
                    const thumbUrl = vidSnippet.thumbnails.maxres ? vidSnippet.thumbnails.maxres.url : vidSnippet.thumbnails.high.url;
                    
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => window.open(`https://youtube.com/watch?v=${videoId}`, '_blank');
                    
                    card.innerHTML = `
                        <img class="thumbnail" src="${thumbUrl}" alt="Thumbnail">
                        <div class="video-info">
                            <h3 class="video-title">${vidSnippet.title}</h3>
                            <span class="video-meta">Uploaded on ${new Date(vidSnippet.publishedAt).toLocaleDateString()}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching data: ", error);
                grid.innerHTML = '<span class="loading-text" style="color: #ff6b6b;">Failed to fetch YouTube data. Check console.</span>';
            }
        }

        async function loadSidebarStats(handle) {
            const cacheKey = `yt_cache_${handle}`;
            const keyId = getIdKey(handle);
            
            // 1. Load cache immediately
            const cachedData = localStorage.getItem(cacheKey);
            if (cachedData) {
                const data = JSON.parse(cachedData);
                document.getElementById(`pfp-${keyId}`).src = data.pfp;
                document.getElementById(`subs-${keyId}`).innerText = `🔴 ${formatSubs(data.subs)} Subs`;
            }

            // 2. Fetch fresh background data
            try {
                const channel = await fetchChannelData(handle);
                if (channel) {
                    const pfpUrl = channel.snippet.thumbnails.default.url;
                    const subCount = channel.statistics.subscriberCount;
                    
                    document.getElementById(`pfp-${keyId}`).src = pfpUrl;
                    document.getElementById(`subs-${keyId}`).innerText = `🔴 ${formatSubs(subCount)} Subs`;
                    
                    localStorage.setItem(cacheKey, JSON.stringify({ pfp: pfpUrl, subs: subCount }));
                }
            } catch (error) {
                console.error(`Failed to load sidebar stats for ${handle}`, error);
            }
        }

        // Automatically trigger data load immediately when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            const creators = ['@wemmbumc', '@ParrotX2', '@FlameFragsMC', '@SpokeIsHere'];
            
            // Load main view for Wemmbu right away
            loadCreator('@wemmbumc', document.getElementById('card-wemmbumc'));
            
            // Load sidebar counts for everyone else
            creators.forEach(handle => {
                if (handle !== '@wemmbumc') {
                    loadSidebarStats(handle);
                }
            });
        });
    </script>
</body>
</html>
