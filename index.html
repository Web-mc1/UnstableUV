<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unstable Creators</title>
    <style>
        /* CSS variables for dark theme and gradients */
        :root {
            --bg-dark: #121212;
            --panel-bg: rgba(30, 30, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --transition: 0.3s ease;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling (Discord-like nameplates) */
        .sidebar {
            width: 280px;
            background: #181818;
            border-right: 1px solid var(--glass-border);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: var(--transition);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .creator-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition);
        }

        .creator-card:hover, .creator-card.active {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            transform: scale(1.03); /* Hover zooms mentioned in the video */
        }

        .pfp {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #333;
            object-fit: cover;
        }

        .creator-info {
            display: flex;
            flex-direction: column;
        }

        .creator-name {
            font-weight: 600;
            font-size: 16px;
        }

        .sub-count {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* Main Content Section */
        .main-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            /* Gray to green gradient he experimented with at the end */
            background: linear-gradient(135deg, #121212 0%, #1a2620 100%); 
        }

        .banner {
            height: 250px;
            background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564') center/cover;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            transition: var(--transition);
        }

        .banner-content h1 {
            margin: 0;
            font-size: 48px;
        }

        .banner-content p {
            margin: 5px 0 0 0;
            font-size: 20px;
            color: var(--text-sub);
        }

        /* Videos Grid (Glassmorphism design) */
        .videos-section {
            padding: 40px;
        }

        .videos-section h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .video-card {
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: var(--transition);
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .thumbnail {
            width: 100%;
            height: 160px;
            background: #2a2a2a;
            object-fit: cover;
        }

        .video-info {
            padding: 15px;
        }

        .video-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .video-meta {
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">UNSTABLE</div>
        
        <!-- Creator Cards -->
        <div class="creator-card active" onclick="switchCreator('wemmbu', this)">
            <img class="pfp" src="https://api.dicebear.com/7.x/avataaars/svg?seed=wemmbu" alt="Wemmbu">
            <div class="creator-info">
                <span class="creator-name">Wemmbu</span>
                <span class="sub-count">🔴 4.35M Subs</span>
            </div>
        </div>

        <div class="creator-card" onclick="switchCreator('parrot', this)">
            <img class="pfp" src="https://api.dicebear.com/7.x/avataaars/svg?seed=parrot" alt="Parrot">
            <div class="creator-info">
                <span class="creator-name">Parrot</span>
                <span class="sub-count">🔴 1.2M Subs</span>
            </div>
        </div>

        <div class="creator-card" onclick="switchCreator('flame', this)">
            <img class="pfp" src="https://api.dicebear.com/7.x/avataaars/svg?seed=flame" alt="Flame">
            <div class="creator-info">
                <span class="creator-name">Flame</span>
                <span class="sub-count">🔴 2.7M Subs</span>
            </div>
        </div>

        <div class="creator-card" onclick="switchCreator('spoke', this)">
            <img class="pfp" src="https://api.dicebear.com/7.x/avataaars/svg?seed=spoke" alt="Spoke">
            <div class="creator-info">
                <span class="creator-name">Spoke</span>
                <span class="sub-count">🔴 1.5M Subs</span>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="banner">
            <div class="banner-content">
                <h1 id="page-title">Wemmbu</h1>
                <p id="page-desc">Minecraft & Entertainment • 4.35M Subscribers</p>
            </div>
        </div>

        <div class="videos-section">
            <h2>Latest Videos</h2>
            <div class="video-grid" id="video-grid">
                <!-- Videos inject here via JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Placeholder data simulating the YouTube API integration Caleb mentioned
        const creatorData = {
            wemmbu: {
                name: 'Wemmbu',
                desc: 'Minecraft & Entertainment • 4.35M Subscribers',
                videos: ['I trapped 100 players...', 'Minecraft but it is cursed', 'Surviving 100 Days in Hardcore', 'The ultimate base build']
            },
            parrot: {
                name: 'Parrot',
                desc: 'Gaming & Mods • 1.2M Subscribers',
                videos: ['Testing weird mods', 'I made a new server', 'Parrot SMP Episode 1', 'Don\'t do this in Minecraft']
            },
            flame: {
                name: 'Flame',
                desc: 'PVP & Challenges • 2.7M Subscribers',
                videos: ['Bedwars against pros', '1v1 tournament highlights', 'Minecraft speedrun record', 'How to win every PVP match']
            },
            spoke: {
                name: 'Spoke',
                desc: 'Comedy & SMPs • 1.5M Subscribers',
                videos: ['Spoke SMP finale', 'Trolling my friends', 'Building a massive farm', 'The funniest modpack ever']
            }
        };

        // Populate the video grid dynamically
        function populateVideos(creatorKey) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = ''; 
            
            const data = creatorData[creatorKey];
            
            data.videos.forEach((title) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                // Using placeholder images for video thumbnails
                card.innerHTML = `
                    <img class="thumbnail" src="https://images.unsplash.com/photo-1627398225081-24c89544eb1a?q=80&w=600&auto=format&fit=crop" alt="Thumbnail">
                    <div class="video-info">
                        <h3 class="video-title">${title}</h3>
                        <span class="video-meta">3 days ago • 100K views</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Handle sidebar switching
        function switchCreator(creatorKey, element) {
            // Update the active state on the sidebar
            document.querySelectorAll('.creator-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');

            // Update Page Content
            document.getElementById('page-title').innerText = creatorData[creatorKey].name;
            document.getElementById('page-desc').innerText = creatorData[creatorKey].desc;

            // Load new videos
            populateVideos(creatorKey);
        }

        // Initialize with Wemmbu's page on load
        window.onload = () => {
            populateVideos('wemmbu');
        };
    </script>
</body>
</html>
